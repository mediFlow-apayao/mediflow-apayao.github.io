<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediFlow HMS - Patient Intake Wizard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f6f9; color: #2c3e50; }
    .app { max-width: 850px; margin: auto; }
    #banner { background: #1e293b; color: #4ade80; padding: 10px 16px; border-radius: 6px; margin-bottom: 15px; font-family: monospace; font-size: 13px; border-left: 5px solid #4ade80; display: flex; justify-content: space-between; }
    .hdr { background: #2c3e50; color: #fff; padding: 15px 20px; border-radius: 6px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .hdr h1 { margin: 0; font-size: 20px; }
    .btn-db { background: #8e44ad; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .wiz-card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.08); border-top: 5px solid #3498db; }
    .steps { display: flex; gap: 8px; margin-bottom: 20px; background: #f1f5f9; padding: 8px; border-radius: 6px; }
    .step { flex: 1; text-align: center; padding: 8px; font-size: 13px; font-weight: bold; border-radius: 4px; color: #64748b; }
    .step.act { background: #3498db; color: #fff; }
    .step.done { background: #27ae60; color: #fff; }
    label { display: block; margin: 12px 0 5px; font-weight: bold; font-size: 13px; }
    input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    .nav { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; }
    .btn { padding: 10px 20px; border: none; border-radius: 4px; color: #fff; font-weight: bold; cursor: pointer; font-size: 14px; }
    .err { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; font-size: 13px; font-weight: bold; margin-bottom: 12px; display: none; }
    .review { background: #f8fafc; border: 1px solid #cbd5e1; padding: 15px; border-radius: 6px; line-height: 1.7; font-size: 14px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 999; justify-content: center; align-items: center; }
    .mbox { background: #fff; padding: 25px; border-radius: 8px; width: 92%; max-width: 850px; max-height: 85vh; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 15px; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
  </style>
</head>
<body>
<div class="app">
  <div id="banner"><span id="st">System Status: SQL Database Ready!</span><span>Zandrisel Pogss</span></div>
  <div class="hdr">
    <h1>MediFlow HMS — Patient Intake</h1>
    <button type="button" class="btn-db" onclick="openDB()">View SQL Database (<span id="cnt">0</span>)</button>
  </div>
  <div class="wiz-card">
    <div class="steps">
      <div class="step act" id="s1">1. Patient Information</div>
      <div class="step" id="s2">2. Doctor & Room</div>
      <div class="step" id="s3">3. Billing</div>
      <div class="step" id="s4">4. Review & Save</div>
    </div>
    <div id="errBox" class="err"></div>
    <div id="wizBody"></div>
    <div class="nav">
      <button type="button" id="btnBack" class="btn" style="background:#7f8c8d;visibility:hidden;" onclick="move(-1)">← Previous</button>
      <button type="button" id="btnNext" class="btn" style="background:#3498db;" onclick="move(1)">Next Step →</button>
    </div>
  </div>
</div>

<div id="dbModal" class="modal">
  <div class="mbox">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <h2 style="margin:0;color:#8e44ad;">SQL Database Records</h2>
      <div>
        <input type="file" id="importFile" accept=".sql" style="display:none;" onchange="importSQL(event)">
        <button type="button" class="btn" style="background:#16a085;padding:6px 12px;font-size:12px;" onclick="document.getElementById('importFile').click()">Import .SQL</button>
        <button type="button" class="btn" style="background:#2980b9;padding:6px 12px;font-size:12px;" onclick="exportSQL()">Export .SQL</button>
        <button type="button" class="btn" style="background:#e74c3c;padding:6px 12px;font-size:12px;" onclick="document.getElementById('dbModal').style.display='none'">Close ✖</button>
      </div>
    </div>
    <table>
      <thead><tr><th>ID</th><th>Patient Name</th><th>Diagnosis</th><th>Doctor & Room</th><th>Schedule</th><th>Total Bill</th><th>Action</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div>
<script>
  var step = 1;
  var data = { name: "", hist: "", doc: "", room: "", time: "", c: 0, l: 0, m: 0, r: 0 };

  // Built-in SQL Engine backed by persistent browser storage & .SQL file export/import
  var SQL_DB = {
    schema: "CREATE TABLE IF NOT EXISTS patients (id INT PRIMARY KEY AUTO_INCREMENT, name VARCHAR(255), hist TEXT, doc VARCHAR(255), room VARCHAR(255), time VARCHAR(100), bill DECIMAL(10,2));",
    getRows: function() {
      return JSON.parse(localStorage.getItem("mf_sql_patients") || "[]");
    },
    saveRows: function(rows) {
      localStorage.setItem("mf_sql_patients", JSON.stringify(rows));
      document.getElementById("cnt").innerText = rows.length;
    },
    query: function(sql, params) {
      var rows = this.getRows();
      var upper = sql.trim().toUpperCase();

      if (upper.indexOf("SELECT") === 0) {
        return rows.slice().sort(function(a, b) { return b.id - a.id; });
      }
      if (upper.indexOf("INSERT INTO PATIENTS") === 0) {
        var maxId = rows.reduce(function(max, item) { return item.id > max ? item.id : max; }, 0);
        rows.push({
          id: maxId + 1,
          name: params.name,
          hist: params.hist,
          doc: params.doc,
          room: params.room,
          time: params.time,
          bill: params.bill
        });
        this.saveRows(rows);
        return true;
      }
      if (upper.indexOf("DELETE FROM PATIENTS WHERE ID") === 0) {
        rows = rows.filter(function(item) { return item.id !== params.id; });
        this.saveRows(rows);
        return true;
      }
      if (upper.indexOf("DELETE FROM PATIENTS") === 0) {
        this.saveRows([]);
        return true;
      }
    }
  };

  function render() {
    document.getElementById("errBox").style.display = "none";
    for (var i = 1; i <= 4; i++) {
      var el = document.getElementById("s" + i);
      el.className = "step" + (i === step ? " act" : (i < step ? " done" : ""));
    }
    var box = document.getElementById("wizBody");
    if (step === 1) {
      box.innerHTML = "<label>Patient Full Name *</label><input id='inName' value='" + data.name + "' placeholder='e.g., Juan Dela Cruz'><label>Medical History / Diagnostics</label><textarea id='inHist' rows='4' placeholder='Enter symptoms, vitals, or diagnosis...'>" + data.hist + "</textarea>";
    } else if (step === 2) {
      box.innerHTML = "<label>Attending Doctor</label><input id='inDoc' value='" + data.doc + "' placeholder='e.g., Dr. Maria Santos'><label>Hospital Ward / Room</label><input id='inRoom' value='" + data.room + "' placeholder='e.g., Ward A - Bed 3'><label>Schedule Date & Time</label><input type='datetime-local' id='inTime' value='" + data.time + "'>";
    } else if (step === 3) {
      box.innerHTML = "<label>Consultation Fee (₱)</label><input type='number' id='inC' value='" + data.c + "' min='0'><label>Laboratory Screening Fee (₱)</label><input type='number' id='inL' value='" + data.l + "' min='0'><label>Pharmacy Medicine Cost (₱)</label><input type='number' id='inM' value='" + data.m + "' min='0'><label>Room Charges (₱)</label><input type='number' id='inR' value='" + data.r + "' min='0'>";
    } else if (step === 4) {
      var total = data.c + data.l + data.m + data.r;
      box.innerHTML = "<div class='review'><strong>Patient Name:</strong> " + data.name + "<br><strong>Diagnostics:</strong> " + (data.hist || "None") + "<br><strong>Attending Doctor:</strong> " + (data.doc || "Unassigned") + "<br><strong>Ward / Room:</strong> " + (data.room || "N/A") + "<br><strong>Schedule:</strong> " + (data.time || "Not Set") + "<br><hr><strong style='color:#d35400;font-size:16px;'>Grand Total Bill: ₱" + total.toFixed(2) + "</strong></div>";
    }
    document.getElementById("btnBack").style.visibility = step === 1 ? "hidden" : "visible";
    var next = document.getElementById("btnNext");
    next.innerText = step === 4 ? "Save Record to SQL" : "Next Step →";
    next.style.background = step === 4 ? "#27ae60" : "#3498db";
  }

  function move(dir) {
    if (step === 1) {
      data.name = document.getElementById("inName").value.trim();
      data.hist = document.getElementById("inHist").value.trim();
      if (dir > 0 && !data.name) {
        var err = document.getElementById("errBox");
        err.innerText = "✖ Please enter the Patient Full Name before moving to Step 2.";
        err.style.display = "block";
        return;
      }
    } else if (step === 2) {
      data.doc = document.getElementById("inDoc").value.trim();
      data.room = document.getElementById("inRoom").value.trim();
      data.time = document.getElementById("inTime").value;
    } else if (step === 3) {
      data.c = Number(document.getElementById("inC").value) || 0;
      data.l = Number(document.getElementById("inL").value) || 0;
      data.m = Number(document.getElementById("inM").value) || 0;
      data.r = Number(document.getElementById("inR").value) || 0;
    } else if (step === 4 && dir > 0) {
      SQL_DB.query("INSERT INTO patients (name, hist, doc, room, time, bill) VALUES (?, ?, ?, ?, ?, ?)", {
        name: data.name,
        hist: data.hist || "None",
        doc: data.doc || "Unassigned",
        room: data.room || "N/A",
        time: data.time || "Not Set",
        bill: data.c + data.l + data.m + data.r
      });
      data = { name: "", hist: "", doc: "", room: "", time: "", c: 0, l: 0, m: 0, r: 0 };
      step = 1;
      render();
      openDB();
      return;
    }
    step += dir;
    render();
  }

  function openDB() {
    var recs = SQL_DB.query("SELECT * FROM patients ORDER BY id DESC");
    var rows = "";
    for (var i = 0; i < recs.length; i++) {
      var x = recs[i];
      rows += "<tr><td><b>#" + x.id + "</b></td><td><b>" + x.name + "</b></td><td>" + x.hist + "</td><td>" + x.doc + " (" + x.room + ")</td><td>" + x.time + "</td><td style='color:#d35400;font-weight:bold;'>₱" + Number(x.bill).toFixed(2) + "</td><td><button type='button' class='btn' style='background:#e74c3c;padding:4px 8px;font-size:12px;' onclick='delRec(" + x.id + ")'>Delete</button></td></tr>";
    }
    document.getElementById("tb").innerHTML = rows || "<tr><td colspan='7' style='text-align:center;padding:20px;'>No records saved yet.</td></tr>";
    document.getElementById("dbModal").style.display = "flex";
  }

  function delRec(id) {
    if (!confirm("Delete record #" + id + " from SQL?")) return;
    SQL_DB.query("DELETE FROM patients WHERE id = ?", { id: id });
    openDB();
  }

  function exportSQL() {
    var recs = SQL_DB.getRows();
    var sqlDump = SQL_DB.schema + "\nDELETE FROM patients;\n";
    for (var i = 0; i < recs.length; i++) {
      var r = recs[i];
      sqlDump += "INSERT INTO patients (id, name, hist, doc, room, time, bill) VALUES (" +
        r.id + ", '" + String(r.name).replace(/'/g, "''") + "', '" + String(r.hist).replace(/'/g, "''") + "', '" +
        String(r.doc).replace(/'/g, "''") + "', '" + String(r.room).replace(/'/g, "''") + "', '" + String(r.time) + "', " + Number(r.bill) + ");\n";
    }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([sqlDump], { type: "application/sql" }));
    a.download = "MediFlow_Database.sql";
    a.click();
  }

  function importSQL(event) {
    var file = event.target.files;
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      var lines = reader.result.split("\n");
      var imported = [];
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        var match = line.match(/^INSERT INTO patients.*VALUES\s*\((\d+),\s*'((?:''|[^'])*)',\s*'((?:''|[^'])*)',\s*'((?:''|[^'])*)',\s*'((?:''|[^'])*)',\s*'((?:''|[^'])*)',\s*([\d.]+)\);$/i);
        if (match) {
          imported.push({
            id: Number(match),
            name: match.replace(/''/g, "'"),
            hist: match.replace(/''/g, "'"),
            doc: match.replace(/''/g, "'"),
            room: match.replace(/''/g, "'"),
            time: match,
            bill: Number(match)
          });
        }
      }
      if (imported.length > 0) {
        SQL_DB.saveRows(imported);
        openDB();
        alert("Imported " + imported.length + " SQL records successfully!");
      } else {
        alert("No valid INSERT INTO patients statements found in the .sql file.");
      }
    };
    reader.readAsText(file);
  }

  document.getElementById("cnt").innerText = SQL_DB.getRows().length;
  render();
</script>
</body>
</html>
